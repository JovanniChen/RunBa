# RunBa Backend API 配置文件

# 应用基本配置
app:
  name: 'RunBa Backend API'
  version: '1.0.0'
  environment: 'development'

# 服务器配置
server:
  host: '0.0.0.0'
  port: '8080'
  mode: 'debug' # debug, release, test
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 60

# 数据库配置
database:
  host: '127.0.0.1'
  port: '3306'
  user: 'root'
  password: 'Jio19880617'
  name: 'rb'
  charset: 'utf8mb4'
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600
  log_level: 'info'

# JWT配置
jwt:
  secret: 'test-secret-key'
  expiration: 24 # 小时
  refresh_expiration: 168 # 小时

# 日志配置
log:
  level: 'debug' # debug, info, warn, error
  format: 'json' # json, text
  output: 'stdout' # stdout, stderr, file
