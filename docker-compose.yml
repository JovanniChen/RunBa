services:
  mysql:
    image: mysql:8.0
    container_name: runba-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: rb
      MYSQL_USER: runba
      MYSQL_PASSWORD: runba123
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./runba-backend
      dockerfile: Dockerfile
    container_name: runba-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./docker/config.yaml:/app/config.yaml
    environment:
      TZ: Asia/Shanghai

  frontend:
    build:
      context: ./runba-frontend
      dockerfile: Dockerfile
    container_name: runba-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai

  nginx:
    image: nginx:alpine
    container_name: runba-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
