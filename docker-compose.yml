services:
  mysql:
    image: mysql:8.0
    container_name: runba-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "ChangeMeRootPass!"
      MYSQL_DATABASE: "rb"
      MYSQL_USER: "runba"
      MYSQL_PASSWORD: "ChangeMeDBPass!"
      TZ: "Asia/Tokyo"
    volumes:
      - runba_mysql_data:/var/lib/mysql
      - ./runba-backend/forges_swordsmiths.sql:/docker-entrypoint-initdb.d/01_forges_swordsmiths.sql:ro
      - ./runba-backend/certificates.sql:/docker-entrypoint-initdb.d/02_certificates.sql:ro
      - ./deploy/docker/mysql-init/03_users.sql:/docker-entrypoint-initdb.d/03_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: runba-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - runba_redis_data:/data

  backend:
    build:
      context: ./runba-backend
      dockerfile: Dockerfile
    container_name: runba-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./runba-backend/config.docker.yaml:/app/config.yaml:ro
    expose:
      - "8080"

  frontend:
    build:
      context: ./runba-frontend
      dockerfile: Dockerfile
    container_name: runba-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: runba-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./deploy/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  runba_mysql_data:
  runba_redis_data:
